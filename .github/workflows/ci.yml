name: Guardian regression and contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [trust_engine, cipherguard, license_compliance, prompt_injection, code_security, docker_security, secret_detection, workflow_cicd]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: CPU embedding dependency
        if: matrix.service == 'prompt_injection'
        run: python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Native scanner preparation
        if: matrix.service == 'code_security'
        working-directory: services/code_security
        run: python -c "from app.main import run_semgrep; assert run_semgrep('eval(input())', 'warmup.py', 90)"
      - name: Run service suite
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: .
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest tests -q
      - run: python scripts/sync_contracts.py --check && python scripts/sync_runtime.py --check
  interfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 pyyaml==6.0.1 httpx==0.28.1
      - run: python -m pytest scripts/tests -q
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: npm ci --prefix integrations/vscode && npm run build --prefix integrations/vscode
  learned_model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/trust_engine/requirements.txt -r evaluation/trust_model/requirements.txt
      - name: Reproduce synthetic pilot training and verify SHAP
        run: python scripts/train_trust_model.py --responses evaluation/trust_model/final-validation/responses.jsonl --output .data/ci-model --report-dir .data/ci-model-report --model-version ci-synthetic-validation
      - name: Verify model safety seam
        working-directory: services/trust_engine
        run: python -m pytest tests/test_ml_scoring.py -q
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: guardian_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/trust_engine/requirements.txt
      - name: Migrate and seed
        working-directory: services/trust_engine
        env:
          DATABASE_URL: postgresql+asyncpg://guardian:ci-test-password@localhost:5432/guardian_test
        run: python -m alembic upgrade head && python -m app.seed
      - name: PostgreSQL lifecycle integration
        working-directory: services/trust_engine
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://guardian:ci-test-password@localhost:5432/guardian_test
          PYTHONPATH: .
        run: python -m pytest tests/test_postgres_integration.py -q
