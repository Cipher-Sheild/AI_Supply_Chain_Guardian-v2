# Runtime license policy; explicit organization denylist defaults empty.
license_policy:
  mode: no-copyleft
  allowed_licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - PSF-2.0
  - 0BSD
  - Unlicense
  - CC0-1.0
  denied_licenses: []
  always_flag:
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  unknown_handling: needs_review
cache:
  ttl_days: 3
transitive_dependency_check:
  enabled: true
  max_candidates: 10
