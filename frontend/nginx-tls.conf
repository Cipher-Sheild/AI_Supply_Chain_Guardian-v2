upstream guardian_api {
  zone guardian_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  server trust_engine:8000 resolve;
}
server {
  listen 8080;
  listen 8443 ssl;
  ssl_certificate /etc/guardian-tls/server.crt;
  ssl_certificate_key /etc/guardian-tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name localhost;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass http://guardian_api/;
    proxy_read_timeout 15s;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  }
}
