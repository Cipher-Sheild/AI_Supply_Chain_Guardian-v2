upstream guardian_api {
  zone guardian_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  server trust_engine:8000 resolve;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://guardian_api/; proxy_read_timeout 15s; }
}
